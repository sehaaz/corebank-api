openapi: 3.0.3

info:
  title: CoreBank API
  version: 1.0.0
  description: |
    Banking transaction service, built as a modular monolith.

    Five modules: `identity`, `account`, `transaction`, `fx`, `audit`.
    A money transfer runs inside a single Oracle transaction, driven by the
    `pkg_transfer.do_transfer` stored procedure.

    ## Authentication
    The JWT returned by `POST /api/auth/login` (HS256, 15 minutes) is sent in the
    `Authorization: Bearer <token>` header. It carries the `customerId` and `role`
    claims.

    Account ownership is verified against the database on every request - knowing
    the IBAN is not enough.

    ## Error format
    Every error uses the same body:

    ```json
    { "error": "INSUFFICIENT_FUNDS", "message": "Insufficient funds", "status": 409 }
    ```

    Validation failures add a `details` array.

    ## Error codes

    | Code | HTTP | Description |
    |---|---|---|
    | `VALIDATION_ERROR` | 400 | Request validation failed (`details` is populated) |
    | `INVALID_AMOUNT` | 400 | Amount is not positive, or has more than 2 decimals |
    | `UNAUTHORIZED` | 401 | Token missing, invalid or expired |
    | `FORBIDDEN` | 403 | Account belongs to someone else, or role is insufficient |
    | `ACCOUNT_NOT_FOUND` | 404 | No account with that IBAN |
    | `CUSTOMER_NOT_FOUND` | 404 | Customer not found |
    | `NOT_FOUND` | 404 | Endpoint not found |
    | `INSUFFICIENT_FUNDS` | 409 | Insufficient funds (`ORA-20001`) |
    | `DAILY_LIMIT_EXCEEDED` | 409 | Daily transfer limit exceeded (`ORA-20002`) |
    | `SAME_ACCOUNT` | 409 | Sender and receiver are the same (`ORA-20003`) |
    | `ACCOUNT_NOT_ACTIVE` | 409 | Account is `FROZEN` or `CLOSED` (`ORA-20004`) |
    | `RATE_NOT_FOUND` | 409 | No exchange rate defined (`ORA-20005`) |
    | `ACCOUNT_NOT_EMPTY` | 409 | An account with a balance cannot be closed |
    | `DUPLICATE` | 409 | Email or national ID already registered (`ORA-00001`) |
    | `RATE_LIMITED` | 429 | Per-minute transfer attempt limit exceeded |
    | `INTERNAL_ERROR` | 500 | Unexpected error (details stay in the server log) |

servers:
  - url: http://localhost:3000
    description: Local development (docker compose)

tags:
  - name: identity
    description: Customer registration, login and profile
  - name: account
    description: Account opening, balance and status
  - name: transaction
    description: Deposits, withdrawals, transfers and statements
  - name: fx
    description: Foreign exchange rates
  - name: audit
    description: Change history
  - name: system
    description: Service status

paths:

  /health:
    get:
      tags: [system]
      summary: Liveness probe
      description: Reports only that the process responds; it does not touch the database.
      security: []
      responses:
        '200':
          description: Service is up
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
              example:
                status: ok

  /api/auth/register:
    post:
      tags: [identity]
      summary: Register a customer
      description: Passwords are stored with `bcrypt` (cost 12). The role is always `CUSTOMER`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            example:
              nationalId: '12345678901'
              fullName: Ayşe Yılmaz
              email: ayse@corebank.test
              password: Demo1234!
      responses:
        '201':
          description: Customer created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
              example:
                id: 1
                nationalId: '12345678901'
                fullName: Ayşe Yılmaz
                email: ayse@corebank.test
                role: CUSTOMER
        '400':
          $ref: '#/components/responses/ValidationError'
        '409':
          description: Email or national ID is already registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: DUPLICATE
                message: Record already exists
                status: 409

  /api/auth/login:
    post:
      tags: [identity]
      summary: Log in and receive a JWT
      description: The token is signed with HS256 and is valid for 15 minutes.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              email: ayse@corebank.test
              password: Demo1234!
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
              example:
                token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJjdXN0b21lcklkIjoxLCJyb2xlIjoiQ1VTVE9NRVIifQ.xxx
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          description: Invalid email or password
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: UNAUTHORIZED
                message: Invalid email or password
                status: 401

  /api/customers/me:
    get:
      tags: [identity]
      summary: Get the authenticated customer profile
      description: The password hash is never returned.
      responses:
        '200':
          description: Profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
              example:
                id: 1
                nationalId: '12345678901'
                fullName: Ayşe Yılmaz
                email: ayse@corebank.test
                role: CUSTOMER
                createdAt: '2026-09-22T18:10:00.000Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Customer not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: CUSTOMER_NOT_FOUND
                message: Customer not found
                status: 404

  /api/accounts:
    post:
      tags: [account]
      summary: Open an account
      description: The IBAN is produced by the PL/SQL function `fn_generate_iban` (TR + mod-97).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currency]
              properties:
                currency:
                  $ref: '#/components/schemas/Currency'
            example:
              currency: TRY
      responses:
        '201':
          description: Account opened
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  iban:
                    $ref: '#/components/schemas/Iban'
                  currency:
                    $ref: '#/components/schemas/Currency'
                  balance:
                    type: number
                  status:
                    $ref: '#/components/schemas/AccountStatus'
              example:
                id: 6
                iban: TR580006100000000000000006
                currency: TRY
                balance: 0
                status: ACTIVE
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'

    get:
      tags: [account]
      summary: List the customer own accounts
      description: 'Read from the `V_ACCOUNT_SUMMARY` view; includes the transaction count and the last transaction date.'
      responses:
        '200':
          description: Account summaries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AccountSummary'
              example:
                - id: 1
                  iban: TR330006100519786457841326
                  currency: TRY
                  balance: 24750
                  fullName: Ayşe Yılmaz
                  txCount: 3
                  lastTx: '2026-09-22T18:28:28.992Z'
                - id: 2
                  iban: TR060006100519786457841327
                  currency: USD
                  balance: 1190
                  fullName: Ayşe Yılmaz
                  txCount: 1
                  lastTx: '2026-09-22T18:29:02.110Z'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/accounts/{iban}:
    get:
      tags: [account]
      summary: Get one account
      description: Ownership is verified against the database.
      parameters:
        - $ref: '#/components/parameters/IbanPath'
      responses:
        '200':
          description: Account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
              example:
                id: 1
                customerId: 1
                iban: TR330006100519786457841326
                currency: TRY
                balance: 24750
                dailyLimit: 50000
                status: ACTIVE
                createdAt: '2026-09-22T18:10:00.000Z'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/AccountNotFound'

  /api/accounts/{iban}/status:
    patch:
      tags: [account]
      summary: Change account status
      description: |
        Only the `TELLER` role may call this.
        An account with a non-zero balance cannot be set to `CLOSED`.
      parameters:
        - $ref: '#/components/parameters/IbanPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  $ref: '#/components/schemas/AccountStatus'
            example:
              status: FROZEN
      responses:
        '200':
          description: Status updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
              example:
                id: 6
                customerId: 1
                iban: TR580006100000000000000006
                currency: TRY
                balance: 100
                dailyLimit: 50000
                status: FROZEN
                createdAt: '2026-09-22T18:25:00.000Z'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/AccountNotFound'
        '409':
          description: An account with a balance cannot be closed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: ACCOUNT_NOT_EMPTY
                message: An account with a non-zero balance cannot be closed
                status: 409

  /api/transactions/deposit:
    post:
      tags: [transaction]
      summary: Deposit money
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MovementRequest'
            example:
              iban: TR330006100519786457841326
              amount: 500.25
              description: salary
      responses:
        '201':
          description: Transaction completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Movement'
              example:
                id: 12
                type: DEPOSIT
                amount: 500.25
                balanceAfter: 25250.25
                referenceNo: 9f1c1c6e-3a5e-4b6f-9a2d-77b7d3b1a9f1
                description: salary
                createdAt: '2026-09-22T18:30:00.000Z'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/AccountNotFound'
        '409':
          description: Account is not active
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: ACCOUNT_NOT_ACTIVE
                message: Account is not active
                status: 409

  /api/transactions/withdraw:
    post:
      tags: [transaction]
      summary: Withdraw money
      description: The balance check runs under a `FOR UPDATE` row lock.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MovementRequest'
            example:
              iban: TR330006100519786457841326
              amount: 250
              description: atm
      responses:
        '201':
          description: Transaction completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Movement'
              example:
                id: 13
                type: WITHDRAW
                amount: 250
                balanceAfter: 25000.25
                referenceNo: 2b7f0a44-9c1d-4a55-8f3e-1d2c4b5a6e7f
                description: atm
                createdAt: '2026-09-22T18:31:00.000Z'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/AccountNotFound'
        '409':
          $ref: '#/components/responses/InsufficientFunds'

  /api/transactions/transfer:
    post:
      tags: [transaction]
      summary: Transfer between accounts
      description: |
        Calls the `pkg_transfer.do_transfer` stored procedure. The procedure locks
        both accounts with `FOR UPDATE` in **alphabetical IBAN order** - a fixed
        order is what prevents deadlocks.

        When the currencies differ, the rate is read from `EXCHANGE_RATES`: the
        sender is debited `amount` and the receiver is credited the converted
        amount. Both legs of the transfer share the same `reference_no`.

        This endpoint has its own stricter rate limit (default: 5 requests per
        customer per minute).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransferRequest'
            example:
              fromIban: TR330006100519786457841326
              toIban: TR230006200119786457841001
              amount: 250
              description: rent
      responses:
        '201':
          description: Transfer completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransferResult'
              example:
                referenceNo: 5C178D48E8860A4EE063020014AC970D
                fromIban: TR330006100519786457841326
                toIban: TR230006200119786457841001
                amount: 250
                description: rent
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/AccountNotFound'
        '409':
          description: |
            Business rule violation. The `error` field is one of:
            `INSUFFICIENT_FUNDS`, `DAILY_LIMIT_EXCEEDED`, `SAME_ACCOUNT`,
            `ACCOUNT_NOT_ACTIVE`, `RATE_NOT_FOUND`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                yetersizBakiye:
                  summary: Insufficient funds (ORA-20001)
                  value:
                    error: INSUFFICIENT_FUNDS
                    message: Insufficient funds
                    status: 409
                gunlukLimit:
                  summary: Daily limit exceeded (ORA-20002)
                  value:
                    error: DAILY_LIMIT_EXCEEDED
                    message: Daily transfer limit exceeded
                    status: 409
                ayniHesap:
                  summary: Sender and receiver are the same (ORA-20003)
                  value:
                    error: SAME_ACCOUNT
                    message: Sender and receiver accounts must differ
                    status: 409
                hesapKapali:
                  summary: Account is not ACTIVE (ORA-20004)
                  value:
                    error: ACCOUNT_NOT_ACTIVE
                    message: Account is not active
                    status: 409
                kurYok:
                  summary: No exchange rate defined (ORA-20005)
                  value:
                    error: RATE_NOT_FOUND
                    message: Exchange rate not found
                    status: 409
        '429':
          $ref: '#/components/responses/RateLimited'

  /api/accounts/{iban}/statement:
    get:
      tags: [transaction]
      summary: Account statement
      description: |
        Supports a date range and pagination. When `to` is given as a plain date
        (`2026-09-22`), the whole of that day is included.
      parameters:
        - $ref: '#/components/parameters/IbanPath'
        - name: from
          in: query
          description: Start of the range (ISO 8601, inclusive)
          required: false
          schema:
            type: string
            format: date-time
          example: '2026-09-01'
        - name: to
          in: query
          description: End of the range (ISO 8601)
          required: false
          schema:
            type: string
            format: date-time
          example: '2026-09-22'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Transactions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatementPage'
              example:
                page: 1
                size: 20
                total: 2
                items:
                  - id: 15
                    counterIban: TR230006200119786457841001
                    type: TRANSFER_OUT
                    amount: 250
                    balanceAfter: 24750
                    referenceNo: 5C178D48E8860A4EE063020014AC970D
                    description: rent
                    createdAt: '2026-09-22T18:32:00.000Z'
                  - id: 12
                    counterIban: null
                    type: DEPOSIT
                    amount: 500.25
                    balanceAfter: 25250.25
                    referenceNo: 9f1c1c6e-3a5e-4b6f-9a2d-77b7d3b1a9f1
                    description: salary
                    createdAt: '2026-09-22T18:30:00.000Z'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/AccountNotFound'

  /api/rates:
    get:
      tags: [fx]
      summary: List exchange rates
      description: Static rate table. No authentication required.
      security: []
      responses:
        '200':
          description: Exchange rates
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Rate'
              example:
                - baseCurrency: EUR
                  targetCurrency: TRY
                  rate: 48.7
                  updatedAt: '2026-09-22T18:06:00.000Z'
                - baseCurrency: USD
                  targetCurrency: TRY
                  rate: 41.5
                  updatedAt: '2026-09-22T18:06:00.000Z'

  /api/audit:
    get:
      tags: [audit]
      summary: List audit entries
      description: |
        Only the `TELLER` role may access this.
        Rows are written by the `trg_accounts_audit` trigger: one row per change
        of `balance` or `status` on the `ACCOUNTS` table.
        `oldValue` / `newValue` are returned as JSON text.
      parameters:
        - name: table
          in: query
          description: Filter by table
          required: false
          schema:
            type: string
            enum: [ACCOUNTS]
          example: ACCOUNTS
        - name: from
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Audit entries
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditPage'
              example:
                page: 1
                size: 20
                total: 22
                items:
                  - id: 26
                    tableName: ACCOUNTS
                    recordId: 3
                    action: UPDATE
                    oldValue: '{"balance":9246.00,"status":"ACTIVE"}'
                    newValue: '{"balance":9266.00,"status":"ACTIVE"}'
                    createdAt: '2026-09-22T18:40:11.000Z'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'The token returned by `POST /api/auth/login`. Valid for 15 minutes.'

  parameters:
    IbanPath:
      name: iban
      in: path
      required: true
      description: 26-character Turkish IBAN
      schema:
        $ref: '#/components/schemas/Iban'
      example: TR330006100519786457841326

    Page:
      name: page
      in: query
      required: false
      description: Page number (1-based)
      schema:
        type: integer
        minimum: 1
        default: 1
      example: 1

    Size:
      name: size
      in: query
      required: false
      description: Page size
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
      example: 20

  responses:

    ValidationError:
      description: '`VALIDATION_ERROR` (400) - request validation failed. The offending fields are listed in `details`.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationErrorBody'
          examples:
            dogrulama:
              summary: Field validation
              value:
                error: VALIDATION_ERROR
                message: Request validation failed
                status: 400
                details:
                  - field: amount
                    message: Amount cannot have more than 2 decimal places
            gecersizTutar:
              summary: Service-layer amount check
              value:
                error: INVALID_AMOUNT
                message: Amount must be positive
                status: 400

    Unauthorized:
      description: '`UNAUTHORIZED` (401) - token missing, malformed, badly signed or expired.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            tokenYok:
              summary: Header not sent
              value:
                error: UNAUTHORIZED
                message: Authentication token required
                status: 401
            tokenGecersiz:
              summary: Invalid signature or expired token
              value:
                error: UNAUTHORIZED
                message: Invalid or expired token
                status: 401

    Forbidden:
      description: '`FORBIDDEN` (403) - the account does not belong to the customer in the JWT, or the role is insufficient for the endpoint.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            sahiplik:
              summary: Account belongs to someone else
              value:
                error: FORBIDDEN
                message: You do not own this account
                status: 403
            rol:
              summary: Insufficient role (TELLER required)
              value:
                error: FORBIDDEN
                message: You are not allowed to perform this action
                status: 403

    AccountNotFound:
      description: '`ACCOUNT_NOT_FOUND` (404) - no account is registered with that IBAN.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: ACCOUNT_NOT_FOUND
            message: Account not found
            status: 404

    InsufficientFunds:
      description: '`INSUFFICIENT_FUNDS` (409) - the balance is too low. Raised as `ORA-20001` in PL/SQL.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: INSUFFICIENT_FUNDS
            message: Insufficient funds
            status: 409

    RateLimited:
      description: '`RATE_LIMITED` (429) - the per-minute attempt limit for the transfer endpoint was exceeded.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: RATE_LIMITED
            message: Too many transfer attempts, please try again later
            status: 429

    InternalError:
      description: '`INTERNAL_ERROR` (500) - unexpected error. Details are never leaked to the client, only written to the server log.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: INTERNAL_ERROR
            message: An unexpected error occurred
            status: 500

  schemas:

    Error:
      type: object
      required: [error, message, status]
      properties:
        error:
          type: string
          description: Machine-readable error code
        message:
          type: string
          description: Human-readable explanation
        status:
          type: integer
          description: HTTP status code

    ValidationErrorBody:
      allOf:
        - $ref: '#/components/schemas/Error'
        - type: object
          properties:
            details:
              type: array
              items:
                type: object
                properties:
                  field:
                    type: string
                  message:
                    type: string

    Currency:
      type: string
      enum: [TRY, USD, EUR]

    AccountStatus:
      type: string
      enum: [ACTIVE, FROZEN, CLOSED]

    TransactionType:
      type: string
      enum: [DEPOSIT, WITHDRAW, TRANSFER_IN, TRANSFER_OUT]

    Iban:
      type: string
      pattern: '^TR\d{24}$'
      minLength: 26
      maxLength: 26

    RegisterRequest:
      type: object
      required: [nationalId, fullName, email, password]
      properties:
        nationalId:
          type: string
          pattern: '^\d{11}$'
          description: 11-digit Turkish national ID
        fullName:
          type: string
          minLength: 3
          maxLength: 100
        email:
          type: string
          format: email
          maxLength: 100
        password:
          type: string
          minLength: 8
          maxLength: 72
          format: password

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password

    Customer:
      type: object
      properties:
        id:
          type: integer
        nationalId:
          type: string
        fullName:
          type: string
        email:
          type: string
        role:
          type: string
          enum: [CUSTOMER, TELLER]
        createdAt:
          type: string
          format: date-time

    Account:
      type: object
      properties:
        id:
          type: integer
        customerId:
          type: integer
        iban:
          $ref: '#/components/schemas/Iban'
        currency:
          $ref: '#/components/schemas/Currency'
        balance:
          type: number
        dailyLimit:
          type: number
        status:
          $ref: '#/components/schemas/AccountStatus'
        createdAt:
          type: string
          format: date-time

    AccountSummary:
      type: object
      description: 'Read from the `V_ACCOUNT_SUMMARY` view.'
      properties:
        id:
          type: integer
        iban:
          $ref: '#/components/schemas/Iban'
        currency:
          $ref: '#/components/schemas/Currency'
        balance:
          type: number
        fullName:
          type: string
        txCount:
          type: integer
        lastTx:
          type: string
          format: date-time
          nullable: true

    MovementRequest:
      type: object
      required: [iban, amount]
      properties:
        iban:
          $ref: '#/components/schemas/Iban'
        amount:
          type: number
          exclusiveMinimum: true
          minimum: 0
          description: Positive, at most 2 decimal places
        description:
          type: string
          maxLength: 200

    Movement:
      type: object
      properties:
        id:
          type: integer
        type:
          $ref: '#/components/schemas/TransactionType'
        amount:
          type: number
        balanceAfter:
          type: number
        referenceNo:
          type: string
        description:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time

    TransferRequest:
      type: object
      required: [fromIban, toIban, amount]
      properties:
        fromIban:
          $ref: '#/components/schemas/Iban'
        toIban:
          $ref: '#/components/schemas/Iban'
        amount:
          type: number
          exclusiveMinimum: true
          minimum: 0
        description:
          type: string
          maxLength: 200

    TransferResult:
      type: object
      properties:
        referenceNo:
          type: string
          description: Reference shared by both legs of the transfer (SYS_GUID)
        fromIban:
          $ref: '#/components/schemas/Iban'
        toIban:
          $ref: '#/components/schemas/Iban'
        amount:
          type: number
        description:
          type: string
          nullable: true

    Transaction:
      type: object
      properties:
        id:
          type: integer
        counterIban:
          type: string
          nullable: true
          description: Counterparty account; null for deposits and withdrawals
        type:
          $ref: '#/components/schemas/TransactionType'
        amount:
          type: number
        balanceAfter:
          type: number
        referenceNo:
          type: string
        description:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time

    StatementPage:
      type: object
      properties:
        page:
          type: integer
        size:
          type: integer
        total:
          type: integer
        items:
          type: array
          items:
            $ref: '#/components/schemas/Transaction'

    Rate:
      type: object
      properties:
        baseCurrency:
          $ref: '#/components/schemas/Currency'
        targetCurrency:
          $ref: '#/components/schemas/Currency'
        rate:
          type: number
        updatedAt:
          type: string
          format: date-time

    AuditEntry:
      type: object
      properties:
        id:
          type: integer
        tableName:
          type: string
        recordId:
          type: integer
        action:
          type: string
        oldValue:
          type: string
          nullable: true
          description: JSON text
        newValue:
          type: string
          nullable: true
          description: JSON text
        createdAt:
          type: string
          format: date-time

    AuditPage:
      type: object
      properties:
        page:
          type: integer
        size:
          type: integer
        total:
          type: integer
        items:
          type: array
          items:
            $ref: '#/components/schemas/AuditEntry'

security:
  - bearerAuth: []
