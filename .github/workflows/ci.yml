name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # src/shared/config/env.js fails fast without these; unit tests never connect to Oracle.
      - run: cp .env.example .env
      - run: npm run lint
      - run: npm test
